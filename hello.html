<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM 전자 웨비나 참가 신청</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
      color: #2d3436;
    }
    .card {
      width: 100%;
      max-width: 460px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      animation: fadeUp 0.7s ease both;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo {
      width: 88px;
      height: 88px;
    }
    .company {
      margin: 12px 0 4px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #5877f0;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    .desc {
      margin: 0;
      font-size: 0.95rem;
      color: #636e72;
    }
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .required {
      color: #e84118;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      color: #2d3436;
      background: #fff;
      border: 1px solid #d5dbe3;
      border-radius: 10px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      outline: none;
      border-color: #6c8cff;
      box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.25);
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: #6c8cff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:hover {
      background: #5877f0;
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="웨비나 아이콘">
        <rect width="120" height="120" rx="28" fill="#6c8cff"/>
        <rect x="24" y="30" width="72" height="48" rx="8" fill="#ffffff"/>
        <polygon points="54,44 54,64 72,54" fill="#6c8cff"/>
        <rect x="54" y="78" width="12" height="10" fill="#ffffff"/>
        <rect x="42" y="88" width="36" height="6" rx="3" fill="#ffffff"/>
      </svg>
      <p class="company">PM 전자</p>
      <h1>웨비나 참가 신청</h1>
      <p class="desc">아래 정보를 입력하고 신청 완료 버튼을 눌러 주세요.</p>
    </div>

    <form id="form">
      <div class="field">
        <label for="name">이름 <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="홍길동" required>
      </div>
      <div class="field">
        <label for="email">이메일 <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="example@company.com" required>
      </div>
      <div class="field">
        <label for="company">회사명 <span class="required">*</span></label>
        <input type="text" id="company" name="company" placeholder="회사명" required>
      </div>
      <div class="field">
        <label for="position">직책 <span class="required">*</span></label>
        <input type="text" id="position" name="position" placeholder="예: 매니저" required>
      </div>
      <div class="field">
        <label for="phone">연락처 (선택)</label>
        <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
      </div>
      <button type="submit">신청 완료</button>
    </form>
  </main>

  <script>
    var form = document.getElementById("form");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      var phone = document.getElementById("phone").value.trim();
      var message =
        "웨비나 참가 신청이 완료되었습니다.\n\n" +
        "이름: " + document.getElementById("name").value.trim() + "\n" +
        "이메일: " + document.getElementById("email").value.trim() + "\n" +
        "회사명: " + document.getElementById("company").value.trim() + "\n" +
        "직책: " + document.getElementById("position").value.trim() + "\n" +
        "연락처: " + (phone || "(입력 안 함)");

      alert(message);
      form.reset();
    });
  </script>
</body>
</html>
