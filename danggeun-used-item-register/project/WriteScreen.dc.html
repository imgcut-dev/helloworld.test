<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 물건 팔기 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:15px;color:#1F2328}
input::placeholder,textarea::placeholder{color:#6B7280}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#FFFFFF;color:#1F2328;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;box-sizing:border-box">

  <header style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px;border-bottom:1px solid #E3E6EA">
    <button onClick="{{ hBack }}" aria-label="뒤로" style="width:48px;height:48px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:#1F2328">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="font-weight:700;font-size:18px">내 물건 팔기</div>
  </header>

  <div style="flex:1;min-height:0;overflow:hidden;padding:16px 16px 24px;display:flex;flex-direction:column;gap:20px">

    <sc-if value="{{bannerBlocked}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="display:flex;gap:10px;padding:12px;border-radius:8px;background:#FEF3F2;border:1px solid #B42318;color:#7A271A;font-size:14px">
      <svg width="20" height="20" style="flex:none;margin-top:2px" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
      <div><div style="font-weight:700">등록이 차단되었어요</div><div>판매 금지 품목이거나 사용할 수 없는 단어가 포함되어 있어요. 제목과 설명을 확인해 수정해 주세요.</div></div>
    </div>
    </sc-if>

    <sc-if value="{{bannerNoRedirect}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:#FFF1E6;border:1px solid #C2410C;color:#7C2D12;font-size:14px">
      <div><div style="font-weight:700">등록은 완료됐어요</div><div>게시글 상세 화면으로 이동하지 못했어요. 아래에서 바로 확인할 수 있어요.</div></div>
      <div style="display:flex;gap:8px">
        <button onClick="{{ hBannerDetail }}" style="flex:1;min-height:44px;border-radius:8px;border:none;background:{{accent}};color:#FFFFFF;font-size:14px;font-weight:700">게시글 보기</button>
        <button onClick="{{ hBannerMine }}" style="flex:1;min-height:44px;border-radius:8px;border:1px solid #C2410C;background:#FFFFFF;color:#7C2D12;font-size:14px;font-weight:700">내 판매 목록</button>
      </div>
    </div>
    </sc-if>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-weight:700">사진</div>
      <div style="display:flex;gap:10px;overflow:hidden;padding:12px 12px 0 0">
        <button onClick="{{ hPhotoAdd }}" aria-label="사진 추가" style="flex:none;width:80px;height:80px;border-radius:8px;border:1px dashed #8A94A0;background:#FFFFFF;color:#1F2328;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <span>{{photoCountText}}</span>
        </button>
        <sc-for list="{{photos}}" as="p" hint-placeholder-count="2">
        <div style="position:relative;flex:none;width:80px;height:80px;border-radius:8px;background:#E5E7EB;color:#5B6470;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
          <span>사진 {{p.n}}</span>
          <button aria-label="사진 삭제" style="position:absolute;top:-12px;right:-12px;width:44px;height:44px;border:none;background:none;display:flex;align-items:flex-start;justify-content:flex-end;padding:0">
            <span style="width:22px;height:22px;border-radius:11px;background:#1F2328;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
          </button>
        </div>
        </sc-for>
      </div>
      <sc-if value="{{photoError}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display:flex;gap:6px;align-items:flex-start;color:#B42318;font-size:13px">
        <svg width="16" height="16" style="flex:none;margin-top:3px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
        <span>{{photoError}}</span>
      </div>
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="w-title" style="font-weight:700">제목</label>
      <input id="w-title" type="text" value="{{titleText}}" onChange="{{ noop }}" onFocus="{{ hTitle }}" placeholder="글 제목" style="height:48px;box-sizing:border-box;padding:0 12px;border-radius:8px;border:1px solid {{titleBorder}};box-shadow:{{titleRing}};background:#FFFFFF;outline:none">
      <sc-if value="{{errTitle}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display:flex;gap:6px;align-items:center;color:#B42318;font-size:13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{errTitle}}</span></div>
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-weight:700">카테고리</div>
      <button onClick="{{ hCategory }}" style="height:48px;box-sizing:border-box;padding:0 12px;border-radius:8px;border:1px solid {{categoryBorder}};background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;font-size:15px;color:{{categoryColor}};text-align:left">
        <span>{{categoryLabel}}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
      <sc-if value="{{errCategory}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display:flex;gap:6px;align-items:center;color:#B42318;font-size:13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{errCategory}}</span></div>
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="w-price" style="font-weight:700">판매 가격</label>
      <div style="display:flex;align-items:center;height:48px;box-sizing:border-box;padding:0 12px;border-radius:8px;border:1px solid {{priceBorder}};box-shadow:{{priceRing}};background:#FFFFFF">
        <input id="w-price" type="text" inputmode="numeric" value="{{priceText}}" onChange="{{ noop }}" onFocus="{{ hPrice }}" placeholder="가격을 입력해 주세요" style="flex:1;min-width:0;height:44px;border:none;background:none;padding:0;outline:none">
        <span style="color:#5B6470">원</span>
      </div>
      <sc-if value="{{errPrice}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="display:flex;gap:6px;align-items:center;color:#B42318;font-size:13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg><span>{{errPrice}}</span></div>
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="w-desc" style="font-weight:700">자세한 설명</label>
      <textarea id="w-desc" value="{{descText}}" onChange="{{ noop }}" onFocus="{{ hDesc }}" placeholder="물건의 상태, 사용 기간, 거래 희망 장소를 적어 주세요." style="height:140px;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid {{descBorder}};box-shadow:{{descRing}};background:#FFFFFF;resize:none;line-height:1.5;outline:none"></textarea>
    </div>
  </div>

  <div style="flex:none;padding:12px 16px;border-top:1px solid #E3E6EA;background:#FFFFFF">
    <button onClick="{{ hSubmit }}" style="width:100%;height:52px;border-radius:8px;border:none;background:{{submitBg}};color:#FFFFFF;font-size:17px;font-weight:700;opacity:{{submitOpacity}}">{{submitLabel}}</button>
  </div>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
  <div role="status" style="position:absolute;left:24px;right:24px;bottom:88px;z-index:10;padding:12px 16px;border-radius:8px;background:#1F2328;color:#FFFFFF;font-size:14px;text-align:center">{{toast}}</div>
  </sc-if>

  <sc-if value="{{ovPhotoSheet}}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.5)">
    <div role="dialog" aria-label="사진 추가" style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:16px 16px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:8px">
      <div style="font-weight:700;font-size:17px;padding:0 4px 8px">사진 추가</div>
      <button onClick="{{ hCamera }}" style="height:56px;border:none;background:#F5F6F8;border-radius:8px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:16px;color:#1F2328;text-align:left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        카메라로 촬영하기
      </button>
      <button onClick="{{ hAlbum }}" style="height:56px;border:none;background:#F5F6F8;border-radius:8px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:16px;color:#1F2328;text-align:left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
        앨범에서 선택하기
      </button>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ovCategorySheet}}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.5)">
    <div role="dialog" aria-label="카테고리 선택" style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:16px 16px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column">
      <div style="font-weight:700;font-size:17px;padding:0 4px 8px">카테고리 선택</div>
      <sc-for list="{{categories}}" as="c" hint-placeholder-count="8">
      <button onClick="{{ hCatItem }}" style="min-height:52px;border:none;border-top:1px solid #EEF0F2;background:#FFFFFF;display:flex;align-items:center;padding:0 4px;font-size:16px;color:#1F2328;text-align:left">{{c.label}}</button>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ovDialog}}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:24px;box-sizing:border-box">
    <div role="alertdialog" aria-label="{{dlgTitle}}" style="width:100%;background:#FFFFFF;border-radius:16px;padding:24px 20px 16px;display:flex;flex-direction:column;gap:8px">
      <div style="font-weight:700;font-size:18px">{{dlgTitle}}</div>
      <div style="font-size:15px;color:#3F4752">{{dlgBody}}</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onClick="{{ hDlgClose }}" style="flex:1;height:48px;border-radius:8px;border:1px solid #8A94A0;background:#FFFFFF;color:#1F2328;font-size:15px;font-weight:500">닫기</button>
        <button onClick="{{ hDlgPrimary }}" style="flex:1;height:48px;border-radius:8px;border:none;background:{{accent}};color:#FFFFFF;font-size:15px;font-weight:700">{{dlgPrimary}}</button>
      </div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ovBusy}}" hint-placeholder-val="{{ false }}">
  <div style="position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4)">
    <div role="status" style="width:240px;background:#FFFFFF;border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
      <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#E5E7EB" stroke-width="3"></circle><path d="M21 12a9 9 0 00-9-9" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round"></path></svg>
      <div style="font-weight:700;font-size:16px">{{busyTitle}}</div>
      <div style="font-size:13px;color:#5B6470">{{busyBody}}</div>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C"},"photos":{"editor":null,"default":"0"},"focus":{"editor":null,"default":"none"},"overlay":{"editor":null,"default":"none"},"submitState":{"editor":null,"default":"ready"},"banner":{"editor":null,"default":"none"},"toast":{"editor":null,"default":""},"titleText":{"editor":null,"default":""},"categoryText":{"editor":null,"default":""},"descText":{"editor":null,"default":""},"priceText":{"editor":null,"default":""},"errTitle":{"editor":null,"default":""},"errCategory":{"editor":null,"default":""},"errPrice":{"editor":null,"default":""},"photoError":{"editor":null,"default":""},"onNav":{"editor":null,"tsType":"(key: string) => void"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const g = (k, d) => (p[k] === undefined || p[k] === null ? d : p[k]);
    const accent = g('accent', '#C2410C');
    const n = Number(g('photos', '0')) || 0;
    const focus = g('focus', 'none');
    const overlay = g('overlay', 'none');
    const submitState = g('submitState', 'ready');
    const banner = g('banner', 'none');
    const errTitle = g('errTitle', '');
    const errCategory = g('errCategory', '');
    const errPrice = g('errPrice', '');
    const categoryText = g('categoryText', '');
    const toast = g('toast', '');
    const mk = (k) => () => { if (typeof p.onNav === 'function') p.onNav(k); };

    const border = (err, key) => (err ? '#B42318' : focus === key ? accent : '#8A94A0');
    const ring = (err, key) => (err ? 'none' : focus === key ? '0 0 0 2px ' + accent : 'none');

    const dialogs = {
      permission: {
        title: '카메라·사진 접근 권한이 필요해요',
        body: '사진을 촬영하거나 앨범에서 고르려면 접근을 허용해 주세요. 설정에서 언제든 바꿀 수 있어요.',
        primary: '설정으로 이동'
      },
      saveFail: {
        title: '저장하지 못했어요',
        body: '네트워크 연결이나 서버 상태를 확인한 뒤 다시 시도해 주세요. 작성한 내용은 그대로 남아 있어요.',
        primary: '다시 시도'
      }
    };
    const dlg = dialogs[overlay] || { title: '', body: '', primary: '' };
    const busyMap = {
      validating: { title: '내용을 확인하고 있어요', body: '필수 항목과 판매 금지 품목 포함 여부를 검증하는 중이에요.' },
      saving: { title: '저장하고 있어요', body: '사진과 입력한 내용을 서버에 저장하는 중이에요.' }
    };
    const busy = busyMap[overlay] || { title: '', body: '' };

    const submitBgMap = { ready: accent, pressed: '#7C2D12', busy: accent };

    return {
      accent,
      noop: () => {},
      photos: Array.from({ length: n }, (_, i) => ({ n: i + 1 })),
      photoCountText: n + '장',
      photoError: g('photoError', ''),
      titleText: g('titleText', ''),
      descText: g('descText', ''),
      priceText: g('priceText', ''),
      categoryLabel: categoryText || '카테고리를 선택해 주세요',
      categoryColor: categoryText ? '#1F2328' : '#6B7280',
      errTitle,
      errCategory,
      errPrice,
      titleBorder: border(errTitle, 'title'),
      titleRing: ring(errTitle, 'title'),
      priceBorder: border(errPrice, 'price'),
      priceRing: ring(errPrice, 'price'),
      descBorder: border('', 'desc'),
      descRing: ring('', 'desc'),
      categoryBorder: errCategory ? '#B42318' : '#8A94A0',
      bannerBlocked: banner === 'blocked',
      bannerNoRedirect: banner === 'noRedirect',
      submitBg: submitBgMap[submitState] || accent,
      submitOpacity: submitState === 'busy' ? 0.6 : 1,
      submitLabel: submitState === 'busy' ? '등록 중…' : '작성 완료',
      hBack: mk('back'),
      hPhotoAdd: mk('photoAdd'),
      hCamera: mk('camera'),
      hAlbum: mk('album'),
      hTitle: mk('title'),
      hCategory: mk('category'),
      hCatItem: mk('catItem'),
      hPrice: mk('price'),
      hDesc: mk('desc'),
      hSubmit: mk('submit'),
      hDlgClose: mk('dlgClose'),
      hDlgPrimary: mk('dlgPrimary'),
      hBannerDetail: mk('bannerDetail'),
      hBannerMine: mk('bannerMine'),
      hasToast: !!toast,
      toast,
      ovPhotoSheet: overlay === 'photoSheet',
      ovCategorySheet: overlay === 'categorySheet',
      ovDialog: overlay === 'permission' || overlay === 'saveFail',
      ovBusy: overlay === 'validating' || overlay === 'saving',
      dlgTitle: dlg.title,
      dlgBody: dlg.body,
      dlgPrimary: dlg.primary,
      busyTitle: busy.title,
      busyBody: busy.body,
      categories: ['디지털기기', '생활가전', '가구/인테리어', '생활/주방', '유아동', '의류', '도서', '기타 중고물품'].map((label) => ({ label }))
    };
  }
}
</script>
</body>
</html>
